<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1200,height=800"><title>Internly success loop</title><script src="assets/gsap.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:800px;overflow:hidden;background:transparent}#root{position:relative;width:100%;height:100%;overflow:hidden}.clip{position:absolute;inset:0}.scene{position:absolute;width:960px;height:640px;left:120px;bottom:12px;object-fit:contain}#art{z-index:2}#celebration{z-index:1}#badge-track{z-index:3}#badge{position:absolute;left:546px;top:24px;width:108px;height:108px;border-radius:36px;background:#2563eb;box-shadow:0 10px 24px #0a173818;display:flex;align-items:center;justify-content:center}#badge svg{width:66px;height:66px}#tick{stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none;stroke-dasharray:80;stroke-dashoffset:0}.particle{position:absolute;left:596px;top:84px;width:8px;height:15px;border-radius:3px;background:var(--c);transform:translate(var(--hf-px,0px),var(--hf-py,0px)) rotate(var(--hf-pr,0deg));opacity:var(--hf-po,0)}
</style></head><body>
<div id="root" data-composition-id="success" data-start="0" data-duration="6" data-fps="30" data-width="1200" data-height="800">
<div id="art" class="clip" data-start="0" data-duration="6" data-track-index="0"><img class="scene" src="assets/scene.png" alt="Student and recruiter sharing a high five"></div>
<div id="celebration" class="clip" data-start="0" data-duration="6" data-track-index="1">
<span class="particle" style="--c:#2563eb"></span><span class="particle" style="--c:#93b4fa"></span><span class="particle" style="--c:#2563eb"></span><span class="particle" style="--c:#93b4fa"></span><span class="particle" style="--c:#2563eb"></span><span class="particle" style="--c:#93b4fa"></span><span class="particle" style="--c:#2563eb"></span><span class="particle" style="--c:#93b4fa"></span><span class="particle" style="--c:#2563eb"></span><span class="particle" style="--c:#93b4fa"></span><span class="particle" style="--c:#2563eb"></span><span class="particle" style="--c:#93b4fa"></span>
</div>
<div id="badge-track" class="clip" data-start="0" data-duration="6" data-track-index="2"><div id="badge"><svg viewBox="0 0 64 64" aria-hidden="true"><path id="tick" d="M15 33 L27 45 L50 20"/></svg></div></div>
</div>
<script>
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
tl.fromTo('#badge',{opacity:0,scale:.82,y:8},{opacity:1,scale:1,y:0,duration:.6,ease:'back.out(1.3)'},.25);
tl.fromTo('#tick',{strokeDashoffset:80},{strokeDashoffset:0,duration:.55,ease:'power2.out'},.65);
// The registry confetti component's deterministic CSS-variable particle pattern,
// reduced to twelve blue pieces and a short arc behind the characters.
document.querySelectorAll('.particle').forEach((particle,i)=>{
 const side=i%2===0?-1:1;
 const x=side*(90+Math.floor(i/2)*33);
 const y=-25+Math.floor(i/2)*9;
 const start=1.0+Math.floor(i/2)*.025;
 tl.fromTo(particle,{'--hf-po':0,'--hf-px':'0px','--hf-py':'0px','--hf-pr':'0deg'},{'--hf-po':1,'--hf-px':x+'px','--hf-py':y+'px','--hf-pr':(side*(90+i*22))+'deg',duration:.75,ease:'power3.out'},start);
 tl.to(particle,{'--hf-po':0,'--hf-px':(x+side*22)+'px','--hf-py':(y+90)+'px','--hf-pr':(side*(150+i*22))+'deg',duration:1.5,ease:'sine.inOut'},start+.75);
});
tl.to('#badge',{scale:1.035,duration:.65,repeat:1,yoyo:true,ease:'sine.inOut'},2.45);
tl.to('#badge',{opacity:0,scale:.82,y:8,duration:.55,ease:'power2.in'},4.85);
window.__timelines.success=tl;
</script></body></html>
